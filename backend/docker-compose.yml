# Local DynamoDB for integration tests and serverless-offline development.
# Usage: `docker compose up -d` (or `pnpm -C backend run db:up`), then run
# `pnpm -C backend run db:create-table` (or `db:up` + `DYNAMODB_LOCAL` for
# `test:integration`) or `sls offline start`.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: purchase-approvals-dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb"]
