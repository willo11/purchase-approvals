service: purchase-approvals-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  # Load backend/.env (ignore empty chars) so DYNAMODB_LOCAL, TABLE_NAME,
  # creds etc. reach the running functions during `serverless offline`.
  useDotenv: true
  environment:
    TABLE_NAME: ${self:custom.tableName}
    EVIDENCE_BUCKET: ${self:custom.bucketName}
  # CRITICAL for the evidence download (fresh-review FIX 1): without binary
  # media types, a real REST API v1 deployment does NOT base64-decode the proxy
  # response — the client would receive the base64 STRING as text with a lying
  # Content-Type: application/pdf. serverless-offline bypasses this API
  # boundary, so unit/integration tests cannot catch it; it must be validated
  # against a DEPLOYED API (see MANUAL-TESTING PR #5).
  apiGateway:
    binaryMediaTypes:
      - 'application/pdf'
      - '*/*'
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:TransactWriteItems
      Resource:
        - !GetAtt PurchaseApprovalsTable.Arn
        - !Join ['', [!GetAtt PurchaseApprovalsTable.Arn, '/index/*']]
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
      Resource: !Join ['', [!GetAtt PurchaseApprovalsEvidenceBucket.Arn, '/*']]

custom:
  serverless-offline:
    # Backend API runs on :4000 so it never collides with the frontend
    # (host :3000, requester :3001, approver :3002).
    httpPort: 4000
    # Offline ALSO starts an internal "lambda server"; its default port is 3002,
    # which collides with the approver remote (EADDRINUSE at runtime). Pin it
    # to a free backend-range port instead.
    lambdaPort: 4002
  tableName: purchase-approvals-${self:provider.stage}
  # NOTE: S3 bucket names are globally unique. If `purchase-approvals-evidence-<stage>`
  # is taken, suffix the name at deploy time (PR #8) rather than changing the key schema.
  bucketName: purchase-approvals-evidence-${self:provider.stage}

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

functions:
  health:
    handler: dist/api/health.handler
    events:
      - http:
          path: health
          method: get
          cors: true

  register-user:
    handler: dist/api/handlers/userRegistry.createUser
    events:
      - http:
          path: api/users
          method: post
          cors: true

  list-users:
    handler: dist/api/handlers/userRegistry.listUsers
    events:
      - http:
          path: api/users
          method: get
          cors: true

  create-request:
    handler: dist/api/handlers/purchaseRequest.create
    events:
      - http:
          path: api/purchase-requests
          method: post
          cors: true

  list-requests:
    handler: dist/api/handlers/purchaseRequest.list
    events:
      - http:
          path: api/purchase-requests
          method: get
          cors: true

  request-detail:
    handler: dist/api/handlers/purchaseRequest.detail
    events:
      - http:
          path: api/purchase-requests/{id}
          method: get
          cors: true

  evidence-download:
    handler: dist/api/handlers/evidence.download
    events:
      - http:
          path: api/purchase-requests/{id}/evidence.pdf
          method: get
          cors: true

  mock-mail:
    handler: dist/api/handlers/mockMail.list
    events:
      - http:
          path: mock-mail
          method: get
          cors: true

  docs:
    handler: dist/api/handlers/docs.handlerDocs
    events:
      - http:
          path: docs
          method: get
          cors: true

  docs-spec:
    handler: dist/api/handlers/docs.handlerSpec
    events:
      - http:
          path: docs/openapi.json
          method: get
          cors: true

  issue-otp:
    handler: dist/api/handlers/otp.issue
    events:
      - http:
          path: api/approvals/{requestId}/token/{token}/otp
          method: post
          cors: true

  validate-otp:
    handler: dist/api/handlers/otp.validate
    events:
      - http:
          path: api/approvals/{requestId}/token/{token}/otp/validate
          method: post
          cors: true

  regenerate-otp:
    handler: dist/api/handlers/otp.regenerate
    events:
      - http:
          path: api/approvals/{requestId}/token/{token}/otp/regenerate
          method: post
          cors: true

  recover-approver-otp:
    handler: dist/api/handlers/otp.recover
    events:
      - http:
          path: api/purchase-requests/{requestId}/approvers/{email}/recover
          method: post
          cors: true

  approve:
    handler: dist/api/handlers/signature.approve
    events:
      - http:
          path: api/approvals/{requestId}/token/{token}/approve
          method: post
          cors: true

  reject:
    handler: dist/api/handlers/signature.reject
    events:
      - http:
          path: api/approvals/{requestId}/token/{token}/reject
          method: post
          cors: true

resources:
  Resources:
    PurchaseApprovalsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: otpExpiresAt
          Enabled: true
    PurchaseApprovalsEvidenceBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName}
