  MANUAL-TESTING.md, db:create-table script (no AWS CLI).
  Delivery: PR per capability, 1 commit = 1 task, no line budget, git local.

  PR #2 purchase-request MERGED — the aggregate (PurchaseRequest/Approver/
  Amount/GlobalStatus/ApproverStatus) + CreateRequest/ListRequests/GetRequestDetail
  use cases + DynamoDbRequestRepository (REQ#<id> / REQ#<id>/APPR#<email>, GSI1
  newest-first). TokenIssuerPort/MailPort defined as interfaces with placeholders
  (InMemoryTokenIssuer, LogMailer) — real OTP/TTL + DB-backed mock-mail in PR #3.
  Fresh review caught + fixed a CRITICAL: token was issued TWICE per approver
  (persisted token != mailed approver_token); now issued once and reused.
  Unknown approver email contract fixed to 404 (spec + design-api reconciled).
  Create write hardened to TransactWriteItems (REQ + 3 APPR, one transaction).

  PR #3 approver-otp MERGED — the access gate: Otp/Token value objects, OtpService
  sha256(code+context) (plaintext never stored), OTP in its own TTL item
  (OTP#<reqId>#<email>, 180s) + in-code expiry; gate chain terminal 410 / lockout 403
  / token 404; atomic lockout folded into ONE conditional UpdateItem; MockMailRepo
  + GET /mock-mail. Fresh review caught + fixed CRITICAL: consume was NOT atomic
  (read-compare-delete) -> single-use R4 violated under concurrency; fixed with a
  CAS DeleteCommand (ConditionExpression otpHash + otpExpiresAt). Concurrency
  tests against dynamodb-local (5 parallel wrong -> attempts==3 + lockout; 5 parallel
  correct -> exactly one valid:true). DECISIONS #19 (hardened), #20 (CAS vs idempotency
  key), #21 (mock mail as outbox / SES swap). MANUAL-TESTING updated.

