notes: |
  PR #0 bootstrap merged into main (feat/bootstrap promoted to main).
  PR #1 user-registry MERGED (82b71c1) — first real capability: User domain +
  Email VO, RegisterUser/ListUsers use cases, DynamoDbUserRepository (conditional
  PutItem + GSI1), API handlers, unit 95% + integration, robustness tests
