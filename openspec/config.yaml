# openspec/config.yaml
schema: spec-driven

project: purchase-approvals
description: Serverless purchase-approval flow with concatenated digital signatures (web + mobile clients)

context: |
  Tech stack: Monorepo of independent packages (no workspace tool). backend/ = Node.js 20 + TypeScript,
  Serverless Framework (Lambda + API Gateway + DynamoDB single-table + S3), Clean Architecture
  (domain/application/infrastructure/api); frontend/ = React 18 + axios + React Router v6 + webpack 5
  Module Federation (host + solicitante + aprobador remotes); mobile/ = React Native study, deferred.
  Testing: Jest + ts-jest (backend, node env) and Jest + jsdom + React Testing Library (each frontend
  app), coverage thresholds >=60% enforced in every jest config; integration tests run against
  dynamodb-local (docker compose) gated by the DYNAMODB_LOCAL env var.
  Conventions: Neutral professional English for all artifacts; conventional commits; git repo on main
  with feature branches per PR (force-chained: PR #0 bootstrap + 7 capability PRs).

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false           # Test-first RED-GREEN-REFACTOR not enforced; coverage threshold IS enforced
    test_command: "npm run test:ci"   # backend + host + solicitante + aprobador (root package.json)
  verify:
    test_command: "npm run test:ci"
    build_command: "npm run build:ci"
    coverage_threshold: 60   # Assignment requirement: >=60% coverage

testing:
  strict_tdd: false
  detected: 2026-08-14
  reason: "Scaffolded in PR #0 bootstrap: backend Jest+ts-jest (node), frontend Jest+jsdom+RTL per app. strict_tdd stays false; coverage >=60% is enforced by thresholds in every jest config."
  test_runner:
    framework: jest
    command: npm run test:ci
  layers:
    unit:
      available: true
      tool: jest + ts-jest (backend), jest + jsdom + RTL (frontend)
    integration:
      available: true
      tool: jest against dynamodb-local (backend/docker-compose.yml, DYNAMODB_LOCAL guard)
    e2e:
      available: false
      tool: null
  coverage:
    available: true
    command: npm run test:ci
    threshold_requirement: 60
  quality:
    linter:
      available: false
      command: null
    type_checker:
      available: true
      command: npm --prefix backend run typecheck
    formatter:
      available: false
      command: null
